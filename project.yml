# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: NXTPTT
options:
  bundleIdPrefix: app.eptt
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set by the TestFlight workflow after each upload (see .github/workflows/testflight.yml).
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "9"
packages:
  EPTTCore:
    path: Packages/EPTTCore
targets:
  NXTPTT:
    type: application
    platform: iOS
    sources:
      - path: App/iOS
      - path: App/Shared
    postBuildScripts:
      - name: Bundle APNs key if present
        basedOnDependencyAnalysis: false
        script: |
          # Optional and only for private builds (docs/SETUP.md). Runs before code signing.
          if [ -f "$SRCROOT/Config/APNsAuthKey.p8" ]; then
            cp "$SRCROOT/Config/APNsAuthKey.p8" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/APNsAuthKey.p8"
          fi
    dependencies:
      - package: EPTTCore
      - target: NXTPTTNotify
        embed: true
        codeSign: true
      - target: NXTPTTWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EPTT_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(EPTT_IOS_PROFILE)
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/iOS/Support/NXTPTT.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/iOS/Support/Info.plist
      properties:
        CFBundleDisplayName: NXTPTT
        # Encryption is Apple's CryptoKit only (see docs/SETUP.md, export compliance).
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Michroma-Regular.ttf
          - Exo2-Medium.ttf
          - Exo2-SemiBold.ttf
          - Exo2-Bold.ttf
          - Hind-Regular.ttf
          - Hind-Medium.ttf
          - Hind-SemiBold.ttf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio, push-to-talk, remote-notification]
        NSMicrophoneUsageDescription: NXTPTT uses the microphone while you hold the talk button.
        NSCameraUsageDescription: NXTPTT uses the camera to scan contact codes.
        NSLocalNetworkUsageDescription: NXTPTT talks directly to nearby devices on your network, with no server in between.
        NSBluetoothAlwaysUsageDescription: NXTPTT uses Bluetooth to talk to nearby phones when there is no network.
        NSBonjourServices: [_eptt._udp, _chirp-ptt._tcp, _chirp-ptt._udp, _nxpt-pair._tcp, _nxpt-pair._udp]
        CFBundleURLTypes:
          - CFBundleURLName: app.eptt.links
            CFBundleURLSchemes: [eptt]
        EPTTAPNsTeamID: $(EPTT_APNS_TEAM_ID)
        EPTTAPNsKeyID: $(EPTT_APNS_KEY_ID)
        EPTTAPNsEnvironment: $(EPTT_APNS_ENVIRONMENT)
        EPTTCloudContainer: iCloud.$(EPTT_BUNDLE_ID)
        # Shared with the notification service extension (App/Shared/RelayInbox.swift).
        EPTTAppGroup: group.$(EPTT_BUNDLE_ID)
        EPTTKeychainGroup: $(AppIdentifierPrefix)$(EPTT_BUNDLE_ID).shared
    scheme: {}

  # Plays relayed voice messages as the notification sound while the app is suspended.
  NXTPTTNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: App/NotificationService
      - path: App/Shared
        excludes:
          - "UI/**"
          - "Fonts/**"
    dependencies:
      - package: EPTTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EPTT_BUNDLE_ID).notify
        PROVISIONING_PROFILE_SPECIFIER: $(EPTT_NOTIFY_PROFILE)
        CODE_SIGN_ENTITLEMENTS: App/NotificationService/NXTPTTNotify.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/NotificationService/Info.plist
      properties:
        CFBundleDisplayName: NXTPTT
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        EPTTCloudContainer: iCloud.$(EPTT_BUNDLE_ID)
        EPTTAppGroup: group.$(EPTT_BUNDLE_ID)
        EPTTKeychainGroup: $(AppIdentifierPrefix)$(EPTT_BUNDLE_ID).shared

  NXTPTTWatch:
    type: application
    platform: watchOS
    sources:
      - path: App/Watch
      - path: App/Shared
    dependencies:
      - package: EPTTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EPTT_BUNDLE_ID).watchkitapp
        CODE_SIGN_ENTITLEMENTS: App/Watch/NXTPTTWatch.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(EPTT_WATCH_PROFILE)
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Watch/Info.plist
      properties:
        CFBundleDisplayName: NXTPTT
        # Encryption is Apple's CryptoKit only (see docs/SETUP.md, export compliance).
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Michroma-Regular.ttf
          - Exo2-Medium.ttf
          - Exo2-SemiBold.ttf
          - Exo2-Bold.ttf
          - Hind-Regular.ttf
          - Hind-Medium.ttf
          - Hind-SemiBold.ttf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(EPTT_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: false
        UIBackgroundModes: [remote-notification]
        EPTTAPNsEnvironment: $(EPTT_APNS_ENVIRONMENT)
        EPTTCloudContainer: iCloud.$(EPTT_BUNDLE_ID)
        NSMicrophoneUsageDescription: NXTPTT uses the microphone while you hold the talk button.
    scheme: {}
