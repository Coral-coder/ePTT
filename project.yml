# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: ePTT
options:
  bundleIdPrefix: app.eptt
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  EPTTCore:
    path: Packages/EPTTCore
targets:
  ePTT:
    type: application
    platform: iOS
    sources:
      - path: App/iOS
      - path: App/Shared
      - path: Config/APNsAuthKey.p8
        optional: true
        buildPhase: resources
    dependencies:
      - package: EPTTCore
      - target: ePTTWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EPTT_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: App/iOS/Support/ePTT.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: App/iOS/Support/Info.plist
      properties:
        CFBundleDisplayName: ePTT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, push-to-talk, remote-notification]
        NSMicrophoneUsageDescription: ePTT uses the microphone while you hold the talk button.
        NSCameraUsageDescription: ePTT uses the camera to scan contact codes.
        NSLocalNetworkUsageDescription: ePTT talks directly to nearby devices on your network, with no server in between.
        NSBonjourServices: [_eptt._udp]
        CFBundleURLTypes:
          - CFBundleURLName: app.eptt.links
            CFBundleURLSchemes: [eptt]
        EPTTAPNsTeamID: $(EPTT_APNS_TEAM_ID)
        EPTTAPNsKeyID: $(EPTT_APNS_KEY_ID)
        EPTTAPNsEnvironment: $(EPTT_APNS_ENVIRONMENT)
    scheme: {}

  ePTTWatch:
    type: application
    platform: watchOS
    sources:
      - path: App/Watch
      - path: App/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EPTT_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: App/Watch/Info.plist
      properties:
        CFBundleDisplayName: ePTT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(EPTT_BUNDLE_ID)
        NSMicrophoneUsageDescription: ePTT uses the microphone while you hold the talk button.
    scheme: {}
