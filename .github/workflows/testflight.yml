# Archives NXTPTT and uploads it to TestFlight. Never runs on an ordinary push.
#
#   git tag v0.2.0 && git push origin v0.2.0   → uploads version 0.2.0, build 1
#   Actions → TestFlight → Run workflow         → same version, build number + 1
#
# The current version and build live in project.yml (MARKETING_VERSION,
# CURRENT_PROJECT_VERSION); after a successful upload the workflow commits the numbers it
# used back to main, so the next run continues from there.
# Signing is automatic ("cloud signing"): the App Store Connect API key lets Xcode create and
# use the distribution certificate and profiles, so no certificates or profiles are stored here.
# Setup: docs/SETUP.md, "TestFlight from GitHub Actions".
name: TestFlight

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (leave empty to keep the current one)"
        required: false
      build:
        description: "Build number (leave empty for the next one)"
        required: false

permissions:
  contents: write

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  upload:
    runs-on: macos-15
    # The App Store Connect secrets live in this GitHub environment (Settings → Environments).
    environment: Coral
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name (see docs/SETUP.md)"; exit 1; fi
          done

      - name: Decide version and build
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build }}
        run: |
          current_version=$(sed -nE 's/^ *MARKETING_VERSION: "?([^"]+)"?$/\1/p' project.yml | head -1)
          current_build=$(sed -nE 's/^ *CURRENT_PROJECT_VERSION: "?([0-9]+)"?$/\1/p' project.yml | head -1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION:-$current_version}"
          fi
          if [ -n "$INPUT_BUILD" ]; then
            build="$INPUT_BUILD"
          elif [ "$version" = "$current_version" ]; then
            build=$((current_build + 1))   # same version: next build
          else
            build=1                        # new version: builds start over
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Version must look like 1, 1.2 or 1.2.3 (got '$version')"; exit 1
          fi
          if ! [[ "$build" =~ ^[0-9]+$ ]]; then echo "::error::Build must be a number (got '$build')"; exit 1; fi
          echo "Current $current_version ($current_build) → uploading $version ($build)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Write build configuration
        env:
          EPTT_BUNDLE_ID: ${{ secrets.EPTT_BUNDLE_ID }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          BUNDLE_APNS_KEY: ${{ vars.BUNDLE_APNS_KEY }}
        run: |
          {
            echo "DEVELOPMENT_TEAM = $TEAM_ID"
            if [ -n "$EPTT_BUNDLE_ID" ]; then echo "EPTT_BUNDLE_ID = $EPTT_BUNDLE_ID"; fi
            echo "CODE_SIGN_STYLE = Automatic"
          } > Config/Secrets.xcconfig
          # Optional: live Push to Talk wakes in these builds (docs/SETUP.md, section 3).
          if [ "$BUNDLE_APNS_KEY" = "true" ] && [ -n "$APNS_KEY_P8" ]; then
            printf '%s\n' "$APNS_KEY_P8" > Config/APNsAuthKey.p8
            echo "EPTT_APNS_TEAM_ID = $TEAM_ID" >> Config/Secrets.xcconfig
            echo "EPTT_APNS_KEY_ID = $APNS_KEY_ID" >> Config/Secrets.xcconfig
          fi

      - run: brew install xcodegen && xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project NXTPTT.xcodeproj -scheme NXTPTT -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/NXTPTT.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tail -60

      - name: Upload to TestFlight
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/NXTPTT.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/upload \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded $VERSION ($BUILD_NUMBER). It appears in TestFlight after Apple finishes processing (usually 5 to 20 minutes)."

      - name: Record the version and build on main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          sed -i '' -E "s/^( *MARKETING_VERSION: ).*/\1\"$VERSION\"/" project.yml
          sed -i '' -E "s/^( *CURRENT_PROJECT_VERSION: ).*/\1\"$BUILD_NUMBER\"/" project.yml
          xcodegen generate
          git add project.yml NXTPTT.xcodeproj
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "TestFlight: $VERSION ($BUILD_NUMBER)"
          git push origin main

      - name: Remove keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" Config/APNsAuthKey.p8 Config/Secrets.xcconfig
