# Archives NXTPTT and (optionally) uploads it to TestFlight, driven by markers in the commit
# message of a push to main:
#
#   no marker   nothing happens here (ci.yml still builds and tests)
#   *b          archive and sign only, as a check; nothing is uploaded
#   *u          archive and upload to TestFlight, same version, build number + 1
#
# To release a new version, tag the *u commit: `git tag v0.2.0` and push the tag with the
# branch (`git push origin main v0.2.0`). That uploads 0.2.0 as build 1. A tag on a commit
# without *b or *u does nothing. Running the workflow by hand (Actions → TestFlight → Run
# workflow) always uploads; its version and build fields are optional overrides.
#
# The current version and build live in project.yml (MARKETING_VERSION,
# CURRENT_PROJECT_VERSION); after an upload the workflow commits the numbers it used back to
# main (that commit doesn't trigger workflows).
# Signing is automatic ("cloud signing"): the App Store Connect API key lets Xcode create and
# use the distribution certificate and profiles, so no certificates or profiles are stored here.
# Setup: docs/SETUP.md, "TestFlight from GitHub Actions".
name: TestFlight

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (leave empty to keep the current one)"
        required: false
      build:
        description: "Build number (leave empty for the next one)"
        required: false

permissions:
  contents: write

jobs:
  # Reads the *b / *u markers; cheap, so it runs on Linux for every push.
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      upload: ${{ steps.plan.outputs.upload }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          message=$(git log -1 --format=%B)
          build=false; upload=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            build=true; upload=true
          else
            case "$message" in *'*u'*) build=true; upload=true ;; *'*b'*) build=true ;; esac
          fi
          # A tagged commit is handled by the tag's run, not the branch's, so it isn't built twice.
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$build" = true ]; then
            git fetch --quiet --tags origin
            if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Tagged commit; the tag's run handles it."; build=false; upload=false
            fi
          fi
          echo "build=$build upload=$upload"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "upload=$upload" >> "$GITHUB_OUTPUT"

  upload:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-15
    concurrency:
      group: testflight-upload
      cancel-in-progress: false
    # The App Store Connect secrets live in this GitHub environment (Settings → Environments).
    environment: Coral
    env:
      UPLOAD: ${{ needs.plan.outputs.upload }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name (see docs/SETUP.md)"; exit 1; fi
          done

      - name: Decide version and build
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build }}
        run: |
          current_version=$(sed -nE 's/^ *MARKETING_VERSION: "?([^"]+)"?$/\1/p' project.yml | head -1)
          current_build=$(sed -nE 's/^ *CURRENT_PROJECT_VERSION: "?([0-9]+)"?$/\1/p' project.yml | head -1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION:-$current_version}"
          fi
          if [ -n "$INPUT_BUILD" ]; then
            build="$INPUT_BUILD"
          elif [ "$version" = "$current_version" ]; then
            build=$((current_build + 1))   # same version: next build
          else
            build=1                        # new version: builds start over
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Version must look like 1, 1.2 or 1.2.3 (got '$version')"; exit 1
          fi
          if ! [[ "$build" =~ ^[0-9]+$ ]]; then echo "::error::Build must be a number (got '$build')"; exit 1; fi
          echo "Current $current_version ($current_build) → uploading $version ($build)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Write build configuration
        env:
          EPTT_BUNDLE_ID: ${{ secrets.EPTT_BUNDLE_ID }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          BUNDLE_APNS_KEY: ${{ vars.BUNDLE_APNS_KEY }}
        run: |
          {
            echo "DEVELOPMENT_TEAM = $TEAM_ID"
            if [ -n "$EPTT_BUNDLE_ID" ]; then echo "EPTT_BUNDLE_ID = $EPTT_BUNDLE_ID"; fi
            echo "CODE_SIGN_STYLE = Automatic"
          } > Config/Secrets.xcconfig
          # Optional: live Push to Talk wakes in these builds (docs/SETUP.md, section 3).
          if [ "$BUNDLE_APNS_KEY" = "true" ] && [ -n "$APNS_KEY_P8" ]; then
            printf '%s\n' "$APNS_KEY_P8" > Config/APNsAuthKey.p8
            echo "EPTT_APNS_TEAM_ID = $TEAM_ID" >> Config/Secrets.xcconfig
            echo "EPTT_APNS_KEY_ID = $APNS_KEY_ID" >> Config/Secrets.xcconfig
          fi

      - run: brew install xcodegen && xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project NXTPTT.xcodeproj -scheme NXTPTT -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/NXTPTT.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tail -60

      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/NXTPTT.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/upload \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded $VERSION ($BUILD_NUMBER). It appears in TestFlight after Apple finishes processing (usually 5 to 20 minutes)."

      - name: Record the version and build on main
        if: env.UPLOAD == 'true'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          sed -i '' -E "s/^( *MARKETING_VERSION: ).*/\1\"$VERSION\"/" project.yml
          sed -i '' -E "s/^( *CURRENT_PROJECT_VERSION: ).*/\1\"$BUILD_NUMBER\"/" project.yml
          xcodegen generate
          git add project.yml NXTPTT.xcodeproj
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "TestFlight: $VERSION ($BUILD_NUMBER)"
          git push origin main

      - name: Remove keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" Config/APNsAuthKey.p8 Config/Secrets.xcconfig
