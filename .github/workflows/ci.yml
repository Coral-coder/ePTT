name: CI

on:
  push:
  pull_request:

jobs:
  protocol-vectors:
    name: Protocol vectors are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python tools/reference/eptt_ref.py --check Packages/EPTTCore/Tests/EPTTCoreTests/Fixtures/vectors.json

  core-linux:
    name: EPTTCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/EPTTCore

  apple-build:
    name: Build iOS + watchOS apps
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # ML-KEM (CryptoKit) needs the iOS 26 SDK.
      - name: Select Xcode 26 or later
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26+ on this runner:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project NXTPTT.xcodeproj -scheme NXTPTT \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Show compiler errors
        if: failure()
        run: grep -B2 -A6 "error:" build.log | head -300
