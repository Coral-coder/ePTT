# Copies the App Store Connect and signing secrets from this repo (and its Coral environment)
# into other repos of the same owner as repository secrets, so their TestFlight workflows can
# use the same key and certificate. GitHub never shows a secret's value, so this is the only
# way to copy one. Values go straight from the runner into GitHub Secrets: nothing is printed.
#
# Needs a SECRETS_TOKEN secret (here or in the Coral environment): a fine-grained token that
# includes the target repos with "Secrets: Read and write". Run it from Actions → Share
# secrets → Run workflow, then delete the token. Re-run it whenever a secret here changes.
#
# App-specific secrets (EPTT_BUNDLE_ID, the ad-hoc provisioning profiles) are not copied:
# they only fit this app.
name: Share secrets

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Repositories to copy into (names, same owner)"
        required: true
        default: "bingobuddy shottrax"

permissions:
  contents: read

jobs:
  share:
    runs-on: ubuntu-latest
    environment: Coral
    steps:
      - uses: actions/checkout@v4
      - name: Copy the secrets
        env:
          SECRETS_TOKEN: ${{ secrets.SECRETS_TOKEN || secrets.SECRET_TOKEN }}
          TARGET_REPOS: ${{ inputs.repos }}
          SHARED_SECRETS: >-
            APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8
            DEV_CERT_P12 DEV_CERT_PASSWORD
            APNS_KEY_P8 APNS_KEY_ID
            BUILD_CERTIFICATE_P12_BASE64 P12_PASSWORD
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
          DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          BUILD_CERTIFICATE_P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          if [ -z "$SECRETS_TOKEN" ]; then echo "::error::Add a SECRETS_TOKEN secret first (see the comment at the top of share-secrets.yml)"; exit 1; fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pynacl
          "$RUNNER_TEMP/venv/bin/python" tools/release/share_secrets.py
